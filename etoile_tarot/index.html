<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071326"><title>ÉTOILE TAROT</title><style>
:root{--gold:#e9c58b;--muted:#c5b596}*{box-sizing:border-box}body{margin:0;background:#050e20;color:#f8ecd9;font-family:Georgia,'Yu Mincho','Hiragino Mincho ProN',serif;background-image:radial-gradient(circle at 15% 18%,#b18b6344 1px,transparent 2px),radial-gradient(circle at 83% 43%,#ffe1aa77 1px,transparent 2px),radial-gradient(ellipse at 50% 0%,#1b3153,#071326 65%);background-size:89px 97px,137px 119px,auto;min-height:100vh}.app{max-width:480px;margin:auto;padding:0 17px 42px}.hero{padding:20px 0 0;text-align:center}.hero img{width:min(68%,245px);height:220px;object-fit:cover;object-position:center 61%;border-radius:50%;mask-image:radial-gradient(ellipse,#000 45%,transparent 72%)}.brand{letter-spacing:.24em;font-size:27px;color:var(--gold);margin-top:-5px}.sub{letter-spacing:.55em;font-size:11px;color:var(--gold);margin:8px}.tagline{font-size:12px;color:#c9b79a;margin:17px 0 25px}.rule{height:1px;background:linear-gradient(90deg,transparent,#c29b60,transparent);margin:22px 0}.label{text-align:center;color:var(--gold);font-size:15px;margin-bottom:14px}.topics{display:flex;gap:9px}.topics button{flex:1;border:1px solid #746044;border-radius:11px;background:#101b30;color:#e7d3b5;padding:13px 2px;font-size:15px;font-family:inherit;cursor:pointer}.topics button.active{background:#4b3b38;border-color:#f0c98d;box-shadow:0 0 15px #d9ac5133}.intro{text-align:center;font-size:13px;color:#d7c7af;line-height:1.9;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.slot{text-align:center;min-width:0}.scene{width:100%;aspect-ratio:.6;perspective:1000px;cursor:pointer;border:0;background:transparent;padding:0}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.7,.2,1)}.scene.open .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;border:2px solid #d7b173;overflow:hidden;box-shadow:0 5px 20px #0008}.face img{width:100%;height:100%;object-fit:cover}.back img{object-position:center}.front{transform:rotateY(180deg)}.front img{object-position:center}.pos{color:var(--gold);font-size:15px;margin-top:11px}.cardname{font-size:11px;color:#e9d9bc;margin-top:6px;min-height:28px;line-height:1.3}.hint{color:#b9a991;font-size:12px;text-align:center;margin:20px 0}.primary,.secondary{width:100%;padding:15px 10px;border-radius:9px;font-family:inherit;cursor:pointer;font-size:15px}.primary{background:linear-gradient(120deg,#f7db9e,#b98845,#f2d59b);border:1px solid #f9e2b0;color:#1b1721;font-weight:bold}.secondary{background:#0e1a30;border:1px solid #b99b6e;color:#f0d5a9;margin-top:13px}.reading{margin:22px 0;background:#101d32ee;border:1px solid #aa8858;border-radius:12px;padding:22px 18px;animation:appear .6s}.reading h2{text-align:center;font-size:19px;color:var(--gold);font-weight:normal;margin:0 0 8px}.reading .desc{text-align:center;color:#d2bd9d;font-size:12px;margin-bottom:22px}.reading h3{color:var(--gold);font-size:15px;margin:19px 0 7px}.reading p{line-height:1.9;font-size:13px;color:#eee4d4;margin:0}.note{font-family:sans-serif;font-size:10px;line-height:1.7;color:#a99e8b;margin-top:18px;text-align:center}.footer{text-align:center;font-size:10px;color:#968569;margin:26px 0}.hidden{display:none}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(min-width:600px){.app{box-shadow:0 0 80px #0007;min-height:100vh}}

.ritual{text-align:center;margin:22px 0 25px;animation:appear .45s}.ritual h2{font-size:18px;font-weight:normal;color:var(--gold);margin:5px 0 8px}.ritual p{font-size:13px;color:#d7c7af;line-height:1.8}.deckstage{height:225px;position:relative;overflow:hidden;perspective:900px;margin:15px auto 5px;max-width:340px}.deckcard{position:absolute;left:50%;top:15px;width:112px;height:185px;margin-left:-56px;border:2px solid #d8b575;border-radius:7px;background:#0b1830 url('assets/back.png') center/cover;box-shadow:0 8px 24px #000a;transition:transform .4s;will-change:transform}.deckcard:nth-child(2){transform:translate(3px,-3px)}.deckcard:nth-child(3){transform:translate(6px,-6px)}.deckstage.shuffling .deckcard:nth-child(1){animation:riffleA .72s ease-in-out infinite alternate}.deckstage.shuffling .deckcard:nth-child(2){animation:riffleB .72s ease-in-out infinite alternate}.deckstage.shuffling .deckcard:nth-child(3){animation:riffleC .72s ease-in-out infinite alternate}.deckstage.cutting .deckcard:nth-child(1){animation:cutA .68s ease-in-out}.deckstage.cutting .deckcard:nth-child(2){animation:cutB .68s ease-in-out}.deckstage.cutting .deckcard:nth-child(3){animation:cutC .68s ease-in-out}.counter{font-size:30px;color:#f4dba9;letter-spacing:.1em;margin:8px 0}.counter small{font-size:16px;color:#aa9776}.progress{display:flex;gap:6px;justify-content:center;margin:12px 0 18px}.progress span{height:5px;width:30px;border-radius:10px;background:#4b4650}.progress span.done{background:linear-gradient(90deg,#a5783f,#f4d69d)}.ritual button:disabled{opacity:.5;cursor:wait}@keyframes riffleA{0%{transform:translate(-6px,0) rotate(-3deg)}50%{transform:translate(-83px,-12px) rotate(-16deg)}100%{transform:translate(5px,5px) rotate(5deg)}}@keyframes riffleB{0%{transform:translate(5px,-4px)}50%{transform:translate(81px,-22px) rotate(15deg)}100%{transform:translate(-5px,0) rotate(-5deg)}}@keyframes riffleC{0%{transform:translate(0,-8px)}50%{transform:translate(0,22px) rotate(5deg)}100%{transform:translate(0,-8px)}}@keyframes cutA{0%,100%{transform:translate(0,0)}45%{transform:translate(-85px,-22px) rotate(-9deg)}75%{transform:translate(0,16px)}}@keyframes cutB{0%,100%{transform:translate(3px,-3px)}45%{transform:translate(85px,-16px) rotate(9deg)}75%{transform:translate(0,-19px)}}@keyframes cutC{0%,100%{transform:translate(6px,-6px)}50%{transform:translate(0,24px)}}@media(prefers-reduced-motion:reduce){.deckstage.shuffling .deckcard,.deckstage.cutting .deckcard{animation-duration:.1s}.inner{transition-duration:.1s}}
</style></head><body><main class="app"><header class="hero"><img src="assets/logo.png" alt="ÉTOILE TAROT オリジナルロゴ"><div class="brand">ÉTOILE</div><div class="sub">TAROT</div><div class="tagline">星が導く、あなたの物語。</div></header><div class="rule"></div><div class="label">✧ 占いたいテーマを選ぶ ✧</div><div class="topics" id="topics"><button class="active" data-topic="恋愛">♡ 恋愛</button><button data-topic="仕事">✦ 仕事</button><button data-topic="金運">◇ 金運</button></div><section class="ritual" id="ritual"><h2 id="ritualTitle">✧ 星のシャッフル ✧</h2><p id="ritualInfo">カードを混ぜて、運命の準備を整えましょう。</p><div class="deckstage" id="deckstage"><div class="deckcard"></div><div class="deckcard"></div><div class="deckcard"></div></div><div id="cutCounter" class="counter hidden">0 <small>/ 7</small></div><div id="cutProgress" class="progress hidden"></div><button class="primary" id="ritualAction">✧ シャッフルを始める ✧</button></section><div id="drawArea" class="hidden"><p class="intro">7回のカットが完了しました。<br>過去・現在・未来のカードを順番にタップしてください。</p><section class="cards" id="cards"></section></div><p class="hint hidden" id="hint">0 / 3 枚を開きました</p><button class="primary hidden" id="read">✧ 鑑定結果を見る ✧</button><section class="reading hidden" id="reading"></section><button class="secondary" id="reset">↻ 最初から占い直す</button><p class="note">この試作品はカード10枚を使用しています。鑑定文章はカードの意味に基づくサンプルで、生成AI APIには接続していません。占いは自己理解や娯楽としてお楽しみください。</p><div class="footer">✦ ÉTOILE TAROT ✦</div></main><script>
const cards=[['愚者','THE FOOL','新しい始まり','新しい可能性が広がっています。先入観を手放し、自然体で一歩を踏み出しましょう。'],['魔術師','THE MAGICIAN','創造と行動','あなたの中には、状況を動かす力があります。自分の得意なことを活かしましょう。'],['女教皇','THE HIGH PRIESTESS','直感と静けさ','答えを急がず、内なる声を大切に。静かな観察が大切な気づきをもたらします。'],['女帝','THE EMPRESS','愛と豊かさ','優しさとゆとりが幸運の鍵です。自分自身にも周囲にも温かな気持ちを向けましょう。'],['皇帝','THE EMPEROR','安定と責任','土台を整えるときです。現実的な計画と落ち着いた判断が助けになります。'],['法王','THE HIEROPHANT','信頼と学び','経験者の知恵や信頼できる人の助言から、次の道が見えてきそうです。'],['恋人','THE LOVERS','調和と選択','心から大切にしたいものを選ぶことが、前向きな変化につながります。'],['戦車','THE CHARIOT','意志と前進','目標を明確にし、自信を持って進んでみましょう。焦りすぎないことも大切です。'],['力','STRENGTH','勇気と優しさ','力で押すより、穏やかな強さが物事を良い方向へ導きます。'],['隠者','THE HERMIT','内省と知恵','一人で考える時間が、本当に望む答えを見つける手がかりになります。']];
const positions=['過去','現在','未来'];let topic='恋愛',selected=[],opened=[],phase='ready',cuts=0,busy=false;
function randomCards(){const pool=[...Array(cards.length).keys()];for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,3)}
function shuffle(){selected=randomCards();opened=[];cuts=0;busy=false;phase='ready';document.getElementById('reading').classList.add('hidden');document.getElementById('ritual').classList.remove('hidden');document.getElementById('drawArea').classList.add('hidden');document.getElementById('hint').classList.add('hidden');document.getElementById('read').classList.add('hidden');renderRitual();render()}
function renderRitual(){const title=document.getElementById('ritualTitle'),info=document.getElementById('ritualInfo'),btn=document.getElementById('ritualAction'),counter=document.getElementById('cutCounter'),progress=document.getElementById('cutProgress'),stage=document.getElementById('deckstage');stage.className='deckstage'+(phase==='shuffling'?' shuffling':phase==='cutting'?' cutting':'');counter.classList.toggle('hidden',phase==='ready'||phase==='shuffling');progress.classList.toggle('hidden',phase==='ready'||phase==='shuffling');counter.innerHTML=cuts+' <small>/ 7</small>';progress.innerHTML=Array.from({length:7},(_,i)=>'<span class="'+(i<cuts?'done':'')+'"></span>').join('');title.textContent=phase==='ready'?'✧ 星のシャッフル ✧':phase==='shuffling'?'✧ カードを混ぜています ✧':'✧ 7回カードを切る儀式 ✧';info.textContent=phase==='ready'?'カードを混ぜて、運命の準備を整えましょう。':phase==='shuffling'?'星の導きに身を委ねてください…':cuts===7?'7回のカットが完了しました。':`カードの束を切ってください（${cuts+1}回目）`;btn.textContent=phase==='ready'?'✧ シャッフルを始める ✧':phase==='shuffling'?'シャッフル中…':cuts===7?'✧ 3枚引きへ進む ✧':'✧ カードを切る ✧';btn.disabled=busy}
function ritualAction(){if(busy)return;if(phase==='ready'){phase='shuffling';busy=true;renderRitual();setTimeout(()=>{phase='cut';busy=false;renderRitual()},2500);return}if(phase==='cut'){if(cuts===7){phase='draw';document.getElementById('ritual').classList.add('hidden');document.getElementById('drawArea').classList.remove('hidden');document.getElementById('hint').classList.remove('hidden');document.getElementById('drawArea').scrollIntoView({behavior:'smooth',block:'start'});return}busy=true;phase='cutting';renderRitual();setTimeout(()=>{cuts++;busy=false;phase='cut';renderRitual()},720)}}
function render(){const root=document.getElementById('cards');root.innerHTML=positions.map((p,i)=>`<div class="slot"><button class="scene ${opened.includes(i)?'open':''}" data-i="${i}" aria-label="${p}のカードをめくる"><div class="inner"><div class="face back"><img src="assets/back.png" alt="ÉTOILE TAROTカード裏面"></div><div class="face front"><img src="assets/card${selected[i]}.webp" alt="${cards[selected[i]][0]}のタロットカード"></div></div></button><div class="pos">${p}</div><div class="cardname">${opened.includes(i)?cards[selected[i]][0]:'タップして開く'}</div></div>`).join('');root.querySelectorAll('.scene').forEach(el=>el.addEventListener('click',()=>{let i=+el.dataset.i;if(!opened.includes(i)){opened.push(i);render()}}));document.getElementById('hint').textContent=`${opened.length} / 3 枚を開きました`;document.getElementById('read').classList.toggle('hidden',opened.length!==3)}
function read(){if(opened.length!==3)return;const contextual={恋愛:'人とのつながりや、自分の本当の気持ちを大切にしてください。',仕事:'目標と自分の強みを見つめ直し、無理のない一歩を選んでください。',金運:'お金に関する判断は現実的な情報も確認し、長期的な安心を大切にしてください。'};const html=`<h2>✧ 星からのメッセージ ✧</h2><div class="desc">${topic}の3枚引きリーディング</div>`+positions.map((p,i)=>`<h3>${p}｜${cards[selected[i]][0]} — ${cards[selected[i]][2]}</h3><p>${cards[selected[i]][3]}</p>`).join('')+`<div class="rule"></div><h3>総合メッセージ</h3><p>過去の「${cards[selected[0]][2]}」から、現在の「${cards[selected[1]][2]}」を経て、未来の「${cards[selected[2]][2]}」へと物語が続いています。${contextual[topic]}未来は決まっているわけではありません。カードを自分の気持ちを整理するヒントにしてみましょう。</p>`;const target=document.getElementById('reading');target.innerHTML=html;target.classList.remove('hidden');target.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('ritualAction').addEventListener('click',ritualAction);document.getElementById('topics').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;topic=b.dataset.topic;document.querySelectorAll('.topics button').forEach(x=>x.classList.toggle('active',x===b));shuffle()});document.getElementById('read').addEventListener('click',read);document.getElementById('reset').addEventListener('click',shuffle);shuffle();
</script></body></html>
